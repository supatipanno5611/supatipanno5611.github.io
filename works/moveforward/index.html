<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>moveforward</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <header>
      <span class="title">move</span>
      <span class="step-counter">STEP <span id="step-count">0</span></span>
    </header>

    <main>
      <div id="stage-wrapper">
        <div id="stage">
          <!-- 잔상들이 여기에 동적으로 추가됨 -->
          <!-- 현재 사각형 -->
          <div id="rect"></div>
          <!-- 결승선 -->
          <div id="finish-line">
            <span class="finish-label">FINISH</span>
          </div>
          <!-- 하이라이트 오버레이 -->
          <div id="highlight-overlay" class="hidden"></div>
        </div>
      </div>
    </main>

    <footer>
      <div class="controls">
        <div class="controls-left">
          <button id="btn-move" class="btn btn-primary">
            <span class="btn-label">이동하기</span>
            <span class="btn-sub">move</span>
          </button>
          <button id="btn-undo" class="btn btn-secondary" disabled>
            <span class="btn-label">되돌리기</span>
            <span class="btn-sub">undo</span>
          </button>
        </div>
        <div class="controls-right">
          <button id="btn-highlight-overlap" class="btn btn-highlight" disabled>
            <span class="btn-label">겹침 확인</span>
            <span class="btn-sub">OVERLAP</span>
          </button>
          <button id="btn-highlight-new" class="btn btn-highlight" disabled>
            <span class="btn-label">나아감 확인</span>
            <span class="btn-sub">NEW</span>
          </button>
        </div>
      </div>
    </footer>

    <!-- 완료 화면 -->
    <div id="finish-screen" class="hidden">
      <div class="finish-content">
        <div class="finish-title">FINISH</div>
        <div class="finish-steps">Total <span id="finish-step-count"></span> moved</div>
        <button id="btn-restart" class="btn btn-primary">
          <span class="btn-label">다시 하기</span>
          <span class="btn-sub">RESTART</span>
        </button>
      </div>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
